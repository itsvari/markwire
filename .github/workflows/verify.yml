name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  workflow:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Run workflow tests
        run: python -m unittest discover -s tests -v
      - name: Generate demo
        run: python examples/run_demo.py markwire-demo
      - name: Check generated report
        run: node tests/validate_report.js markwire-demo/reports/review.html
      - name: Generate a grading stage report
        run: python markwire-demo/grading.py --workspace markwire-demo stage-report --stage grading
      - name: Check the remediation packet
        run: node tests/validate_stage_report.js markwire-demo/reports/grading.html
  types:
    name: Static types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python -m pip install mypy==2.4.0 ruff==0.17.3
      - run: npx --yes --package typescript@5.9.3 tsc --allowJs --checkJs --strict --target es2022 --noEmit report_assets/columns.js report_assets/stage.js
      - run: python -m mypy
      - run: python -m ruff check
      - run: python -m ruff format --check
